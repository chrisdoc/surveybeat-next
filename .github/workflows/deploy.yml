name: Deploy

# Deploys staging and production on push to main (after CI).
# Staging runs privacy checks and E2E before production is deployed.
# Alchemy state lives in the Cloudflare state store.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy run at a time, and never cancel a running deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @surveybeat/web build
      - name: Deploy staging
        run: pnpm exec alchemy deploy infra/alchemy.run.ts --stage staging --yes --no-input
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          ORG_CREATION_ALLOWLIST: ${{ secrets.ORG_CREATION_ALLOWLIST }}
      - name: Smoke test
        run: node infra/scripts/smoke.ts "https://staging.app.surveybeat.app" "https://staging.submit.surveybeat.app"
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

  staging-privacy:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read back the Submission Worker's deployed settings
        run: pnpm check:observability --stage staging
      - name: Canary sweep with a positive control
        run: pnpm test:preview-privacy --stage staging "https://staging.app.surveybeat.app" "https://staging.submit.surveybeat.app"

  staging-e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @surveybeat/web build
      - name: Install Chromium
        run: pnpm --filter @surveybeat/infra exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://staging.app.surveybeat.app
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-staging
          path: test-results/e2e
          retention-days: 7

  deploy-production:
    needs: [staging-privacy, staging-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @surveybeat/web build
      - name: Deploy production
        run: pnpm exec alchemy deploy infra/alchemy.run.ts --stage production --yes --no-input
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          ORG_CREATION_ALLOWLIST: ${{ secrets.ORG_CREATION_ALLOWLIST }}
      - name: Smoke test
        run: node infra/scripts/smoke.ts "https://app.surveybeat.app" "https://submit.surveybeat.app"
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
